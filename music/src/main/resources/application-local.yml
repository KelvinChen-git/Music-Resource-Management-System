# Opt in with SPRING_PROFILES_ACTIVE=local. Credentials have no shared defaults.
server:
  address: 127.0.0.1
  port: ${MUSIC_SERVER_PORT:8080}
  servlet:
    context-path: /api
spring:
  datasource:
    druid:
      url: jdbc:mysql://${MUSIC_DB_HOST:127.0.0.1}:${MUSIC_DB_PORT:3307}/${MUSIC_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      username: ${MUSIC_DB_USER}
      password: ${MUSIC_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 40MB
  mail:
    host: ${MUSIC_SMTP_HOST:127.0.0.1}
    port: ${MUSIC_SMTP_PORT:1025}
    username: ${MUSIC_SMTP_USER:}
    password: ${MUSIC_SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
jwt:
  secret: ${MUSIC_JWT_SECRET}
  expiration: 86400000
upload:
  path: ${MUSIC_UPLOAD_PATH}
  temp-path: ${MUSIC_UPLOAD_TEMP_PATH}
  allowed-types: mp3,jpg,jpeg,png
  chunk-size: 5242880
